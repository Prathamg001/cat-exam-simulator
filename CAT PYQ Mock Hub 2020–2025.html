// ============================================================================
// DETERMINISTIC SLOT GENERATOR (Gives distinct ordering/variants per Year & Slot)
// ============================================================================
function buildPaperForConfig({ year, slot, mode, selectedSection, customPapers }) {
  const customKey = `${year}-S${slot}`;
  if (customPapers && customPapers[customKey]) {
    const imported = customPapers[customKey];
    const sections = mode === 'FULL' ? ['VARC', 'DILR', 'QA'] : [selectedSection];
    return sections.map((sec) => ({
      section: sec,
      durationSeconds: 40 * 60,
      questions: imported[sec] || []
    }));
  }

  const yearMeta = CAT_YEAR_CONFIG[year] || CAT_YEAR_CONFIG[2024];
  const sections = mode === 'FULL' ? ['VARC', 'DILR', 'QA'] : [selectedSection];

  // Rotate question blocks deterministically by slot so Slot 1, 2, 3 feel distinct
  const rotateArray = (arr, shift) => {
    if (!arr.length) return arr;
    const s = ((shift % arr.length) + arr.length) % arr.length;
    return [...arr.slice(s), ...arr.slice(0, s)];
  };

  return sections.map((sec) => {
    const targetCount = yearMeta.counts[sec];
    const basePool = [...MASTER_QUESTION_BANK[sec]];

    let ordered = [];
    if (sec === 'VARC') {
      // Group RCs by passageId and rotate passages by slot, keep VA at end
      const rcGroups = RC_PASSAGES.map((p) => basePool.filter((q) => q.passageId === p.id));
      const rotatedRCs = rotateArray(rcGroups, slot - 1).flat();
      const vaQs = rotateArray(basePool.filter((q) => !q.passageId), slot - 1);
      ordered = [...rotatedRCs, ...vaQs].slice(0, targetCount);
    } else if (sec === 'DILR') {
      // Group DILR sets by setId and rotate sets by slot
      const setGroups = DILR_SETS.map((s) => basePool.filter((q) => q.setId === s.id).slice(0, 4));
      const rotatedSets = rotateArray(setGroups, slot - 1).flat();
      const extras = basePool.filter((q) => !rotatedSets.some((rq) => rq.id === q.id));
      ordered = [...rotatedSets, ...extras].slice(0, targetCount);
    } else {
      ordered = rotateArray(basePool, (slot - 1) * 5 + (year % 3)).slice(0, targetCount);
    }

    // Attach passage/set objects directly
    const hydrated = ordered.map((q, idx) => ({
      ...q,
      qNumber: idx + 1,
      passageObj: q.passageId ? RC_PASSAGES.find((p) => p.id === q.passageId) : null,
      setObj: q.setId ? DILR_SETS.find((s) => s.id === q.setId) : null
    }));

    return {
      section: sec,
      durationSeconds: 40 * 60,
      questions: hydrated
    };
  });
}

// ============================================================================
// PERCENTILE ESTIMATOR (Calibrated to CAT 2020-2025 Score vs Percentile)
// ============================================================================
function estimateCatPercentile(score, year, isSectional = false, section = 'VARC') {
  const cfg = CAT_YEAR_CONFIG[year] || CAT_YEAR_CONFIG[2024];
  if (isSectional) {
    const p99 = cfg.sectional99[section] || 36;
    if (score >= p99 * 1.2) return 99.9;
    if (score >= p99) return 99.0 + Math.min(0.85, ((score - p99) / (p99 * 0.25)) * 0.85);
    if (score >= p99 * 0.8) return 95.0 + ((score - p99 * 0.8) / (p99 * 0.2)) * 4.0;
    if (score >= p99 * 0.6) return 85.0 + ((score - p99 * 0.6) / (p99 * 0.2)) * 10.0;
    if (score >= p99 * 0.4) return 68.0 + ((score - p99 * 0.4) / (p99 * 0.2)) * 17.0;
    if (score > 0) return Math.max(25, Math.round((score / (p99 * 0.4)) * 68));
    return 12.0;
  }

  const b = cfg.percentileBenchmarks;
  if (score >= b[99.5] * 1.18) return 99.92;
  if (score >= b[99.5]) return 99.5 + Math.min(0.4, ((score - b[99.5]) / (b[99.5] * 0.2)) * 0.4);
  if (score >= b[99]) return 99.0 + ((score - b[99]) / (b[99.5] - b[99])) * 0.5;
  if (score >= b[98]) return 98.0 + ((score - b[98]) / (b[99] - b[98])) * 1.0;
  if (score >= b[95]) return 95.0 + ((score - b[95]) / (b[98] - b[95])) * 3.0;
  if (score >= b[90]) return 90.0 + ((score - b[90]) / (b[95] - b[90])) * 5.0;
  if (score >= b[85]) return 85.0 + ((score - b[85]) / (b[90] - b[85])) * 5.0;
  if (score >= b[80]) return 80.0 + ((score - b[80]) / (b[85] - b[80])) * 5.0;
  if (score > 0) return Math.max(15, (score / b[80]) * 80);
  return 10.0;
}

// ============================================================================
// ON-SCREEN SCIENTIFIC CALCULATOR (TCS iON CAT Style)
// ============================================================================
function CatScientificCalculator({ onClose }) {
  const [display, setDisplay] = useState('0');
  const [memory, setMemory] = useState(0);
  const [prevVal, setPrevVal] = useState(null);
  const [operator, setOperator] = useState(null);
  const [waitingForOperand, setWaitingForOperand] = useState(false);
  const [historyText, setHistoryText] = useState('');

  const inputDigit = (digit) => {
    if (waitingForOperand) {
      setDisplay(String(digit));
      setWaitingForOperand(false);
    } else {
      setDisplay(display === '0' ? String(digit) : display.length < 14 ? display + digit : display);
    }
  };

  const inputDot = () => {
    if (waitingForOperand) {
      setDisplay('0.');
      setWaitingForOperand(false);
    } else if (!display.includes('.')) {
      setDisplay(display + '.');
    }
  };

  const clearAll = () => {
    setDisplay('0');
    setPrevVal(null);
    setOperator(null);
    setWaitingForOperand(false);
    setHistoryText('');
  };

  const backspace = () => {
    if (waitingForOperand) return;
    setDisplay(display.length > 1 ? display.slice(0, -1) : '0');
  };

  const toggleSign = () => {
    const val = parseFloat(display);
    if (!isNaN(val) && val !== 0) setDisplay(String(-val));
  };

  const applyUnary = (fnName) => {
    const val = parseFloat(display);
    if (isNaN(val)) return;
    let res = val;
    try {
      switch (fnName) {
        case 'sqrt':
          res = val < 0 ? NaN : Math.sqrt(val);
          break;
        case 'sqr':
          res = val * val;
          break;
        case 'inv':
          res = val === 0 ? NaN : 1 / val;
          break;
        case 'log':
          res = val <= 0 ? NaN : Math.log10(val);
          break;
        case 'ln':
          res = val <= 0 ? NaN : Math.log(val);
          break;
        case 'exp':
          res = Math.exp(val);
          break;
        case 'sin':
          res = Math.sin((val * Math.PI) / 180);
          break;
        case 'cos':
          res = Math.cos((val * Math.PI) / 180);
          break;
        case 'tan':
          res = Math.tan((val * Math.PI) / 180);
          break;
        case 'pct':
          res = val / 100;
          break;
        default:
          break;
      }
      if (!isFinite(res) || isNaN(res)) {
        setDisplay('Error');
      } else {
        setDisplay(String(Number(res.toPrecision(10))));
      }
      setWaitingForOperand(true);
    } catch {
      setDisplay('Error');
    }
  };

  const performOperation = (nextOp) => {
    const inputValue = parseFloat(display);
    if (isNaN(inputValue)) {
      setDisplay('0');
      return;
    }

    if (prevVal === null) {
      setPrevVal(inputValue);
      setHistoryText(`${inputValue} ${nextOp}`);
    } else if (operator) {
      const currentValue = prevVal || 0;
      let newValue = currentValue;
      switch (operator) {
        case '+':
          newValue = currentValue + inputValue;
          break;
        case '-':
          newValue = currentValue - inputValue;
          break;
        case '×':
          newValue = currentValue * inputValue;
          break;
        case '÷':
          newValue = inputValue === 0 ? NaN : currentValue / inputValue;
          break;
        case '^':
          newValue = Math.pow(currentValue, inputValue);
          break;
        default:
          break;
      }
      if (!isFinite(newValue) || isNaN(newValue)) {
        setDisplay('Error');
        setPrevVal(null);
        setOperator(null);
        setHistoryText('');
        return;
      }
      const rounded = Number(newValue.toPrecision(10));
      setDisplay(String(rounded));
      setPrevVal(nextOp === '=' ? null : rounded);
      setHistoryText(nextOp === '=' ? '' : `${rounded} ${nextOp}`);
    }
    setWaitingForOperand(true);
    setOperator(nextOp === '=' ? null : nextOp);
  };

  return (
    <div className="fixed top-16 right-6 z-50 w-80 bg-slate-100 border-2 border-slate-400 rounded-lg shadow-2xl select-none text-slate-900 overflow-hidden">
      {/* Titlebar */}
      <div className="bg-[#1e3a8a] text-white px-3 py-2 flex items-center justify-between text-xs font-semibold">
        <div className="flex items-center gap-1.5">
          <CalcIcon className="w-3.5 h-3.5" />
          <span>CAT Scientific Calculator</span>
        </div>
        <button onClick={onClose} className="hover:bg-blue-800 p-0.5 rounded">
          <X className="w-4 h-4" />
        </button>
      </div>

      {/* Screen */}
      <div className="p-2.5 bg-slate-200 border-b border-slate-300">
        <div className="bg-white border border-slate-400 rounded px-2.5 py-1.5 text-right shadow-inner">
          <div className="text-[10px] text-slate-500 h-3.5 font-mono truncate">{historyText || (memory !== 0 ? `M = ${memory}` : '')}</div>
          <div className="text-xl font-mono font-bold text-slate-900 overflow-x-auto">{display}</div>
        </div>
      </div>

      {/* Keypad */}
      <div className="p-2.5 grid grid-cols-5 gap-1.5 text-xs font-semibold">
        {/* Memory Row */}
        <button onClick={() => setMemory(0)} className="bg-slate-300 hover:bg-slate-400 py-1.5 rounded text-slate-800">MC</button>
        <button onClick={() => { setDisplay(String(memory)); setWaitingForOperand(true); }} className="bg-slate-300 hover:bg-slate-400 py-1.5 rounded text-slate-800">MR</button>
        <button onClick={() => setMemory(parseFloat(display) || 0)} className="bg-slate-300 hover:bg-slate-400 py-1.5 rounded text-slate-800">MS</button>
        <button onClick={() => setMemory((m) => m + (parseFloat(display) || 0))} className="bg-slate-300 hover:bg-slate-400 py-1.5 rounded text-slate-800">M+</button>
        <button onClick={() => setMemory((m) => m - (parseFloat(display) || 0))} className="bg-slate-300 hover:bg-slate-400 py-1.5 rounded text-slate-800">M-</button>

        {/* Scientific Row 1 */}
        <button onClick={() => applyUnary('sin')} className="bg-slate-200 hover:bg-slate-300 border border-slate-300 py-1.5 rounded">sin</button>
        <button onClick={() => applyUnary('cos')} className="bg-slate-200 hover:bg-slate-300 border border-slate-300 py-1.5 rounded">cos</button>
        <button onClick={() => applyUnary('tan')} className="bg-slate-200 hover:bg-slate-300 border border-slate-300 py-1.5 rounded">tan</button>
        <button onClick={backspace} className="bg-rose-600 hover:bg-rose-700 text-white py-1.5 rounded">⌫</button>
        <button onClick={clearAll} className="bg-rose-700 hover:bg-rose-800 text-white py-1.5 rounded">C</button>

        {/* Scientific Row 2 */}
        <button onClick={() => applyUnary('log')} className="bg-slate-200 hover:bg-slate-300 border border-slate-300 py-1.5 rounded">log</button>
        <button onClick={() => applyUnary('ln')} className="bg-slate-200 hover:bg-slate-300 border border-slate-300 py-1.5 rounded">ln</button>
        <button onClick={() => applyUnary('exp')} className="bg-slate-200 hover:bg-slate-300 border border-slate-300 py-1.5 rounded">eˣ</button>
        <button onClick={() => performOperation('^')} className="bg-slate-200 hover:bg-slate-300 border border-slate-300 py-1.5 rounded">xʸ</button>
        <button onClick={() => applyUnary('sqrt')} className="bg-slate-200 hover:bg-slate-300 border border-slate-300 py-1.5 rounded">√x</button>

        {/* Digits & Ops */}
        <button onClick={() => inputDigit(7)} className="bg-white hover:bg-slate-50 border border-slate-300 py-2 rounded font-bold text-sm">7</button>
        <button onClick={() => inputDigit(8)} className="bg-white hover:bg-slate-50 border border-slate-300 py-2 rounded font-bold text-sm">8</button>
        <button onClick={() => inputDigit(9)} className="bg-white hover:bg-slate-50 border border-slate-300 py-2 rounded font-bold text-sm">9</button>
        <button onClick={() => performOperation('÷')} className="bg-amber-100 hover:bg-amber-200 border border-amber-300 py-2 rounded font-bold text-sm">÷</button>
        <button onClick={() => applyUnary('pct')} className="bg-slate-200 hover:bg-slate-300 border border-slate-300 py-2 rounded">%</button>

        <button onClick={() => inputDigit(4)} className="bg-white hover:bg-slate-50 border border-slate-300 py-2 rounded font-bold text-sm">4</button>
        <button onClick={() => inputDigit(5)} className="bg-white hover:bg-slate-50 border border-slate-300 py-2 rounded font-bold text-sm">5</button>
        <button onClick={() => inputDigit(6)} className="bg-white hover:bg-slate-50 border border-slate-300 py-2 rounded font-bold text-sm">6</button>
        <button onClick={() => performOperation('×')} className="bg-amber-100 hover:bg-amber-200 border border-amber-300 py-2 rounded font-bold text-sm">×</button>
        <button onClick={() => applyUnary('inv')} className="bg-slate-200 hover:bg-slate-300 border border-slate-300 py-2 rounded">1/x</button>

        <button onClick={() => inputDigit(1)} className="bg-white hover:bg-slate-50 border border-slate-300 py-2 rounded font-bold text-sm">1</button>
        <button onClick={() => inputDigit(2)} className="bg-white hover:bg-slate-50 border border-slate-300 py-2 rounded font-bold text-sm">2</button>
        <button onClick={() => inputDigit(3)} className="bg-white hover:bg-slate-50 border border-slate-300 py-2 rounded font-bold text-sm">3</button>
        <button onClick={() => performOperation('-')} className="bg-amber-100 hover:bg-amber-200 border border-amber-300 py-2 rounded font-bold text-sm">-</button>
        <button onClick={() => applyUnary('sqr')} className="bg-slate-200 hover:bg-slate-300 border border-slate-300 py-2 rounded">x²</button>

        <button onClick={() => inputDigit(0)} className="bg-white hover:bg-slate-50 border border-slate-300 py-2 rounded font-bold text-sm">0</button>
        <button onClick={inputDot} className="bg-white hover:bg-slate-50 border border-slate-300 py-2 rounded font-bold text-sm">.</button>
        <button onClick={toggleSign} className="bg-slate-200 hover:bg-slate-300 border border-slate-300 py-2 rounded font-bold">+/-</button>
        <button onClick={() => performOperation('+')} className="bg-amber-100 hover:bg-amber-200 border border-amber-300 py-2 rounded font-bold text-sm">+</button>
        <button onClick={() => performOperation('=')} className="bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded font-bold text-sm">=</button>
      </div>
    </div>
  );
}

// ============================================================================
// TITA ON-SCREEN KEYPAD (Authentic CAT Type-In-The-Answer Virtual Pad)
// ============================================================================
function TitaVirtualKeypad({ value, onChange }) {
  const handleKey = (key) => {
    const current = value || '';
    if (key === 'CLEAR') {
      onChange('');
    } else if (key === 'BACKSPACE') {
      onChange(current.slice(0, -1));
    } else if (key === '-') {
      if (current.startsWith('-')) {
        onChange(current.slice(1));
      } else {
        onChange('-' + current);
      }
    } else if (key === '.') {
      if (!current.includes('.')) {
        onChange(current === '' || current === '-' ? current + '0.' : current + '.');
      }
    } else {
      if (current.length < 15) {
        onChange(current + key);
      }
    }
  };

  return (
    <div className="mt-4 max-w-xs bg-slate-100 border border-slate-300 rounded-lg p-3 shadow-sm">
      <div className="text-[11px] font-semibold text-slate-600 uppercase tracking-wider mb-1.5">
        Type-In-The-Answer (TITA) Input
      </div>
      <input
        type="text"
        readOnly
        value={value || ''}
        placeholder="Use keypad below..."
        className="w-full bg-white border-2 border-blue-500 rounded px-3 py-2 text-lg font-mono font-bold text-slate-900 mb-2.5 focus:outline-none"
      />
      <div className="grid grid-cols-3 gap-1.5">
        <button
          type="button"
          onClick={() => handleKey('BACKSPACE')}
          className="col-span-3 bg-slate-200 hover:bg-slate-300 text-slate-800 font-semibold py-1.5 rounded text-xs border border-slate-300"
        >
          Backspace
        </button>
        {['7', '8', '9', '4', '5', '6', '1', '2', '3', '0', '.', '-'].map((k) => (
          <button
            key={k}
            type="button"
            onClick={() => handleKey(k)}
            className="bg-white hover:bg-blue-50 active:bg-blue-100 text-slate-900 font-bold py-2 rounded text-sm border border-slate-300 shadow-xs"
          >
            {k}
          </button>
        ))}
        <button
          type="button"
          onClick={() => handleKey('CLEAR')}
          className="col-span-3 bg-rose-50 hover:bg-rose-100 text-rose-700 font-semibold py-1.5 rounded text-xs border border-rose-200 mt-0.5"
        >
          Clear All
        </button>
      </div>
    </div>
  );
}

// ============================================================================
// STATUS PALETTE BADGE (TCS iON Authentic Shapes & Colors)
// ============================================================================
function PaletteBadge({ status, number, active, onClick }) {
  // Statuses:
  // 'NOT_VISITED' -> Grey square
  // 'NOT_ANSWERED' -> Red trapezoid/pill
  // 'ANSWERED' -> Green badge
  // 'MARKED' -> Purple circle
  // 'ANSWERED_MARKED' -> Purple circle with green dot
  let styleClasses = 'bg-slate-200 text-slate-700 border-slate-300 rounded';
  if (status === 'NOT_ANSWERED') {
    styleClasses = 'bg-rose-600 text-white border-rose-700 rounded-t-sm rounded-b-xl';
  } else if (status === 'ANSWERED') {
    styleClasses = 'bg-emerald-600 text-white border-emerald-700 rounded-t-xl rounded-b-sm';
  } else if (status === 'MARKED') {
    styleClasses = 'bg-purple-600 text-white border-purple-700 rounded-full';
  } else if (status === 'ANSWERED_MARKED') {
    styleClasses = 'bg-purple-600 text-white border-purple-700 rounded-full relative';
  }

  return (
    <button
      type="button"
      onClick={onClick}
      className={`w-9 h-9 text-xs font-bold flex items-center justify-center border transition-transform ${styleClasses} ${
        active ? 'ring-2 ring-offset-1 ring-blue-600 scale-105' : 'hover:opacity-90'
      }`}
    >
      {number}
      {status === 'ANSWERED_MARKED' && (
        <span className="w-2.5 h-2.5 bg-emerald-400 border border-white rounded-full absolute -bottom-0.5 -right-0.5" />
      )}
    </button>
  );
}

// ============================================================================
// MAIN APPLICATION COMPONENT
// ============================================================================
function App() {
  // Navigation Screens: 'LOBBY' | 'EXAM' | 'ANALYSIS'
  const [screen, setScreen] = useState('LOBBY');
  const [lobbyTab, setLobbyTab] = useState('PRACTICE'); // 'PRACTICE' | 'HISTORY'

  // Lobby Configuration
  const [selectedYear, setSelectedYear] = useState(2024);
  const [selectedSlot, setSelectedSlot] = useState(1);
  const [examMode, setExamMode] = useState('SECTIONAL'); // 'SECTIONAL' | 'FULL'
  const [selectedSection, setSelectedSection] = useState('VARC'); // 'VARC' | 'DILR' | 'QA'
  const [candidateName, setCandidateName] = useState('CAT Aspirant');

  // Custom Imported Papers (stored in localStorage)
  const [customPapers, setCustomPapers] = useState(() => {
    try {
      const saved = localStorage.getItem('cat_sim_custom_papers_v1');
      return saved ? JSON.parse(saved) : {};
    } catch {
      return {};
    }
  });
  const [showImportModal, setShowImportModal] = useState(false);
  const [importJsonText, setImportJsonText] = useState('');
  const [importError, setImportError] = useState('');

  // Attempt History (stored in localStorage)
  const [attemptHistory, setAttemptHistory] = useState(() => {
    try {
      const saved = localStorage.getItem('cat_sim_history_v1');
      return saved ? JSON.parse(saved) : [];
    } catch {
      return [];
    }
  });

  // Active Exam State
  const [examSections, setExamSections] = useState([]);
  const [activeSecIdx, setActiveSecIdx] = useState(0);
  const [activeQIdx, setActiveQIdx] = useState(0);
  const [sectionTimeLeft, setSectionTimeLeft] = useState(40 * 60);
  const [responses, setResponses] = useState({}); // { [qId]: { answer, status, timeSpent } }
  const [currentDraftAnswer, setCurrentDraftAnswer] = useState('');

  // Exam Modals & UI Utilities
  const [showCalc, setShowCalc] = useState(false);
  const [showInstructions, setShowInstructions] = useState(false);
  const [showQuestionPaper, setShowQuestionPaper] = useState(false);
  const [showSubmitConfirm, setShowSubmitConfirm] = useState(false);
  const [isFullscreenPane, setIsFullscreenPane] = useState(false);

  // Completed Result State for Analysis View
  const [activeResult, setActiveResult] = useState(null);

  // Analysis Filter States
  const [analysisSectionFilter, setAnalysisSectionFilter] = useState('ALL');
  const [analysisStatusFilter, setAnalysisStatusFilter] = useState('ALL');

  // Persist history & custom papers
  useEffect(() => {
    try {
      localStorage.setItem('cat_sim_history_v1', JSON.stringify(attemptHistory));
    } catch {
      // ignore storage quota error
    }
  }, [attemptHistory]);

  useEffect(() => {
    try {
      localStorage.setItem('cat_sim_custom_papers_v1', JSON.stringify(customPapers));
    } catch {
      // ignore storage quota error
    }
  }, [customPapers]);

  // ==========================================================================
  // START EXAM HANDLER
  // ==========================================================================
  const startExam = () => {
    const builtSections = buildPaperForConfig({
      year: selectedYear,
      slot: selectedSlot,
      mode: examMode,
      selectedSection,
      customPapers
    });

    const initialResponses = {};
    builtSections.forEach((sec, sIdx) => {
      sec.questions.forEach((q, qIdx) => {
        initialResponses[q.id] = {
          answer: '',
          status: sIdx === 0 && qIdx === 0 ? 'NOT_ANSWERED' : 'NOT_VISITED',
          timeSpent: 0
        };
      });
    });

    setExamSections(builtSections);
    setActiveSecIdx(0);
    setActiveQIdx(0);
    setSectionTimeLeft(40 * 60);
    setResponses(initialResponses);
    setCurrentDraftAnswer('');
    setShowCalc(false);
    setShowSubmitConfirm(false);
    setScreen('EXAM');
  };

  // ==========================================================================
  // COUNTDOWN TIMER & PER-QUESTION TIME TRACKING (1s tick during EXAM)
  // ==========================================================================
  const currentSectionObj = examSections[activeSecIdx] || null;
  const currentQuestion = currentSectionObj?.questions?.[activeQIdx] || null;

  useEffect(() => {
    if (screen !== 'EXAM' || !currentQuestion) return;

    const timer = setInterval(() => {
      // Increment timeSpent on current question
      setResponses((prev) => {
        const prevRec = prev[currentQuestion.id] || { answer: '', status: 'NOT_ANSWERED', timeSpent: 0 };
        return {
          ...prev,
          [currentQuestion.id]: {
            ...prevRec,
            timeSpent: prevRec.timeSpent + 1
          }
        };
      });

      // Decrement section timer
      setSectionTimeLeft((prevTime) => {
        if (prevTime <= 1) {
          clearInterval(timer);
          handleSectionAutoAdvance();
          return 0;
        }
        return prevTime - 1;
      });
    }, 1000);

    return () => clearInterval(timer);
  });

  // Sync draft answer whenever active question changes
  useEffect(() => {
    if (!currentQuestion) return;
    const saved = responses[currentQuestion.id];
    setCurrentDraftAnswer(saved?.answer || '');
    if (saved && saved.status === 'NOT_VISITED') {
      setResponses((prev) => ({
        ...prev,
        [currentQuestion.id]: {
          ...prev[currentQuestion.id],
          status: 'NOT_ANSWERED'
        }
      }));
    }
  }, [activeSecIdx, activeQIdx, currentQuestion?.id]);

  // ==========================================================================
  // EXAM NAVIGATION & RESPONSE ACTIONS
  // ==========================================================================
  const commitDraftToQuestion = (qId, draftVal, markFlag = false) => {
    const hasAnswer = String(draftVal).trim() !== '';
    let newStatus = 'NOT_ANSWERED';
    if (hasAnswer && markFlag) newStatus = 'ANSWERED_MARKED';
    else if (hasAnswer) newStatus = 'ANSWERED';
    else if (markFlag) newStatus = 'MARKED';

    setResponses((prev) => ({
      ...prev,
      [qId]: {
        ...(prev[qId] || { timeSpent: 0 }),
        answer: draftVal,
        status: newStatus
      }
    }));
  };

  const handleSaveAndNext = () => {
    if (!currentQuestion || !currentSectionObj) return;
    commitDraftToQuestion(currentQuestion.id, currentDraftAnswer, false);
    const nextIdx = (activeQIdx + 1) % currentSectionObj.questions.length;
    setActiveQIdx(nextIdx);
  };

  const handleMarkForReviewAndNext = () => {
    if (!currentQuestion || !currentSectionObj) return;
    commitDraftToQuestion(currentQuestion.id, currentDraftAnswer, true);
    const nextIdx = (activeQIdx + 1) % currentSectionObj.questions.length;
    setActiveQIdx(nextIdx);
  };

  const handleClearResponse = () => {
    if (!currentQuestion) return;
    setCurrentDraftAnswer('');
    setResponses((prev) => ({
      ...prev,
      [currentQuestion.id]: {
        ...(prev[currentQuestion.id] || { timeSpent: 0 }),
        answer: '',
        status: 'NOT_ANSWERED'
      }
    }));
  };

  const handleJumpToQuestion = (targetQIdx) => {
    if (!currentQuestion) return;
    // Save current draft status automatically when navigating palette
    const existingStatus = responses[currentQuestion.id]?.status;
    const wasMarked = existingStatus === 'MARKED' || existingStatus === 'ANSWERED_MARKED';
    commitDraftToQuestion(currentQuestion.id, currentDraftAnswer, wasMarked);
    setActiveQIdx(targetQIdx);
  };

  const handleSectionAutoAdvance = () => {
    // Commit current question first
    if (currentQuestion) {
      const existingStatus = responses[currentQuestion.id]?.status;
      const wasMarked = existingStatus === 'MARKED' || existingStatus === 'ANSWERED_MARKED';
      commitDraftToQuestion(currentQuestion.id, currentDraftAnswer, wasMarked);
    }

    if (activeSecIdx < examSections.length - 1) {
      setActiveSecIdx((idx) => idx + 1);
      setActiveQIdx(0);
      setSectionTimeLeft(40 * 60);
    } else {
      finalizeAndScoreExam();
    }
  };

  const handleConfirmSectionOrExamSubmit = () => {
    setShowSubmitConfirm(false);
    handleSectionAutoAdvance();
  };

  // ==========================================================================
  // SCORING & ANALYTICS ENGINE
  // ==========================================================================
  const finalizeAndScoreExam = () => {
    // Ensure latest draft is captured
    const finalResponses = { ...responses };
    if (currentQuestion) {
      const hasAnswer = String(currentDraftAnswer).trim() !== '';
      const prevSt = finalResponses[currentQuestion.id]?.status;
      const wasMarked = prevSt === 'MARKED' || prevSt === 'ANSWERED_MARKED';
      finalResponses[currentQuestion.id] = {
        ...(finalResponses[currentQuestion.id] || { timeSpent: 0 }),
        answer: currentDraftAnswer,
        status: hasAnswer ? (wasMarked ? 'ANSWERED_MARKED' : 'ANSWERED') : wasMarked ? 'MARKED' : 'NOT_ANSWERED'
      };
    }

    let totalScore = 0;
    let maxPossibleMarks = 0;
    let totalCorrect = 0;
    let totalIncorrect = 0;
    let totalUnattempted = 0;
    let totalPositiveMarks = 0;
    let totalNegativeMarks = 0;
    let totalTimeSeconds = 0;

    const sectionBreakdown = [];
    const topicMap = {};
    const detailedQuestions = [];

    examSections.forEach((sec) => {
      let secScore = 0;
      let secMax = 0;
      let secCorrect = 0;
      let secIncorrect = 0;
      let secUnattempted = 0;
      let secTime = 0;

      sec.questions.forEach((q) => {
        const rec = finalResponses[q.id] || { answer: '', status: 'NOT_VISITED', timeSpent: 0 };
        const userAns = String(rec.answer || '').trim();
        const isAttempted = userAns !== '';
        let isCorrect = false;
        let marksAwarded = 0;

        secMax += 3;
        maxPossibleMarks += 3;
        secTime += rec.timeSpent;
        totalTimeSeconds += rec.timeSpent;

        if (isAttempted) {
          // Compare normalized numeric/string answer
          const normUser = userAns.replace(/\s+/g, '').toLowerCase();
          const normCorrect = String(q.correctAnswer).replace(/\s+/g, '').toLowerCase();
          isCorrect = normUser === normCorrect;

          if (isCorrect) {
            marksAwarded = 3;
            secCorrect += 1;
            totalCorrect += 1;
            totalPositiveMarks += 3;
          } else {
            marksAwarded = q.type === 'MCQ' ? -1 : 0;
            secIncorrect += 1;
            totalIncorrect += 1;
            if (q.type === 'MCQ') totalNegativeMarks += 1;
          }
        } else {
          secUnattempted += 1;
          totalUnattempted += 1;
        }

        secScore += marksAwarded;
        totalScore += marksAwarded;

        // Topic aggregation
        const topicKey = `${sec.section} • ${q.topic}`;
        if (!topicMap[topicKey]) {
          topicMap[topicKey] = {
            topic: q.topic,
            section: sec.section,
            total: 0,
            correct: 0,
            incorrect: 0,
            unattempted: 0,
            score: 0,
            timeSpent: 0
          };
        }
        topicMap[topicKey].total += 1;
        topicMap[topicKey].score += marksAwarded;
        topicMap[topicKey].timeSpent += rec.timeSpent;
        if (!isAttempted) topicMap[topicKey].unattempted += 1;
        else if (isCorrect) topicMap[topicKey].correct += 1;
        else topicMap[topicKey].incorrect += 1;

        detailedQuestions.push({
          ...q,
          userAnswer: userAns,
          status: rec.status,
          timeSpent: rec.timeSpent,
          isAttempted,
          isCorrect,
          marksAwarded
        });
      });

      const secAttempted = secCorrect + secIncorrect;
      const secAccuracy = secAttempted > 0 ? Math.round((secCorrect / secAttempted) * 100) : 0;
      const secPercentile = estimateCatPercentile(secScore, selectedYear, true, sec.section);

      sectionBreakdown.push({
        section: sec.section,
        totalQuestions: sec.questions.length,
        score: secScore,
        maxMarks: secMax,
        correct: secCorrect,
        incorrect: secIncorrect,
        unattempted: secUnattempted,
        accuracy: secAccuracy,
        timeSpent: secTime,
        estimatedPercentile: Number(secPercentile.toFixed(2))
      });
    });

    const totalQuestionsCount = totalAttempted + totalUnattempted;

                        setActiveResult(item);

                      <div className="flex items-center justify-between mb-2">

                        </span>
                        <span className="text-[11px] text-slate-500">{item.timestamp}</span>

                      <div className="grid grid-cols-3 gap-2 mt-4 pt-4 border-t border-slate-800">

                        </div>

        </main>

        {/* Custom PYQ JSON Importer Modal */}
        {showImportModal && (
          <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-xs flex items-center justify-center p-4">
            <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-2xl w-full p-6 shadow-2xl">

              <div className="mt-5 flex items-center justify-end gap-3">
                {customPaperExists && (
                  <button
                    type="button"
                    onClick={() => {
                      const updated = { ...customPapers };

                      setCustomPapers(updated);

                <button
                  type="button"

                <button
                  type="button"
                  onClick={handleImportCustomPaper}
                  className="px-4 py-2 rounded-lg bg-blue-600 text-white text-xs font-bold hover:bg-blue-500"
                >
                  Save & Bind to CAT {selectedYear} S{selectedSlot}
                </button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  // ==========================================================================
  // VIEW 2: AUTHENTIC TCS iON CAT EXAM INTERFACE
  // ==========================================================================
  if (screen === 'EXAM' && currentSectionObj && currentQuestion) {
    const isSplitLayout = Boolean(currentQuestion.passageObj || currentQuestion.setObj);
    const isLowTime = sectionTimeLeft <= 300; // under 5 mins

    return (
      <div className="h-screen flex flex-col bg-white text-slate-900 overflow-hidden select-none">
        {/* Top TCS iON Blue Header */}
        <header className="bg-[#1e3a8a] text-white px-4 py-2 flex items-center justify-between shrink-0 shadow">
          <div className="flex items-center gap-3">
            <span className="font-extrabold tracking-wide text-sm sm:text-base">
              CAT {selectedYear} — Slot {selectedSlot}
            </span>
            <span className="hidden md:inline-block text-xs bg-blue-800/90 border border-blue-600 px-2.5 py-0.5 rounded">

            </span>
          </div>

          <div className="flex items-center gap-2 sm:gap-3">
            <button
              type="button"
              onClick={() => setShowQuestionPaper(true)}

            >
              <FileText className="w-3.5 h-3.5" />
              <span className="hidden sm:inline">Question Paper</span>
            </button>
            <button
              type="button"
              onClick={() => setShowInstructions(true)}
              className="bg-blue-800 hover:bg-blue-700 border border-blue-600 px-2.5 py-1 rounded text-xs font-semibold flex items-center gap-1"
            >
              <Info className="w-3.5 h-3.5" />
              <span className="hidden sm:inline">Instructions</span>
            </button>
            <button
              type="button"
              onClick={() => setShowCalc((v) => !v)}
              className={`px-2.5 py-1 rounded text-xs font-bold flex items-center gap-1 border transition ${
                showCalc
                  ? 'bg-amber-400 text-slate-950 border-amber-300'
                  : 'bg-blue-700 hover:bg-blue-600 text-white border-blue-500'
              }`}
            >
              <CalcIcon className="w-3.5 h-3.5" />
              <span>Calculator</span>
            </button>
          </div>
        </header>

        {/* Sub-Header: Section Tabs (Locked in Full Mock) + Countdown Timer */}
        <div className="bg-slate-100 border-b border-slate-300 px-4 py-1.5 flex flex-wrap items-center justify-between gap-2 shrink-0">
          <div className="flex items-center gap-1.5">
            <span className="text-[11px] font-bold text-slate-500 uppercase mr-1">Sections:</span>
            {examSections.map((sec, idx) => {
              const isActive = idx === activeSecIdx;
              const isLocked = idx !== activeSecIdx;
              return (
                <div
                  key={sec.section}
                  title={isLocked ? 'Locked by CAT sectional time limit' : 'Active Section'}
                  className={`px-3 py-1 rounded text-xs font-bold flex items-center gap-1.5 border ${
                    isActive
                      ? 'bg-[#2563eb] text-white border-blue-700 shadow-xs'
                      : 'bg-slate-200 text-slate-500 border-slate-300 cursor-not-allowed'
                  }`}
                >
                  <span>{sec.section}</span>
                  {isLocked && <Lock className="w-3 h-3" />}
                </div>
              );
            })}
          </div>

          {/* Live Section Timer */}
          <div className="flex items-center gap-3">
            <div
              className={`px-3 py-1 rounded border font-mono text-sm font-extrabold flex items-center gap-2 ${
                isLowTime
                  ? 'bg-rose-100 border-rose-400 text-rose-700 animate-pulse'
                  : 'bg-white border-slate-300 text-slate-900'
              }`}
            >
              <Clock className={`w-4 h-4 ${isLowTime ? 'text-rose-600' : 'text-blue-700'}`} />
              <span>Time Left: {formatClock(sectionTimeLeft)}</span>
            </div>
          </div>
        </div>

        {/* Main Body: Question Workspace + Right Palette Sidebar */}
        <div className="flex-1 flex flex-col lg:flex-row overflow-hidden">
          {/* Left / Center Question Workspace */}
          <div className="flex-1 flex flex-col overflow-hidden border-r border-slate-300">
            {/* Question Top Metadata Strip */}
            <div className="bg-slate-50 border-b border-slate-200 px-4 py-2 flex flex-wrap items-center justify-between gap-2 shrink-0">
              <div className="flex items-center gap-2">
                <span className="text-sm font-extrabold text-slate-900">
                  Question No. {currentQuestion.qNumber}
                </span>
                <span className="text-[11px] font-semibold px-2 py-0.5 rounded bg-slate-200 text-slate-700">
                  {currentQuestion.type === 'TITA' ? 'Type In The Answer (TITA)' : 'Multiple Choice (MCQ)'}
                </span>
              </div>
              <div className="flex items-center gap-3 text-xs font-semibold">
                <span className="text-emerald-700">Correct: +3</span>
                <span className="text-rose-700">
                  Wrong: {currentQuestion.type === 'MCQ' ? '-1' : '0 (No Negative)'}
                </span>
              </div>
            </div>

            {/* Split-Screen or Single-Pane Question Body */}
            <div className="flex-1 flex flex-col md:flex-row overflow-hidden">
              {/* Left Passage / DILR Caselet Pane (if applicable) */}
              {isSplitLayout && (
                <div
                  className={`${
                    isFullscreenPane ? 'w-full' : 'md:w-1/2'
                  } h-1/2 md:h-full overflow-y-auto p-5 bg-[#fcfcfd] border-b md:border-b-0 md:border-r border-slate-300 leading-relaxed`}
                >
                  <div className="flex items-center justify-between mb-3 pb-2 border-b border-slate-200">
                    <h3 className="text-xs font-extrabold uppercase tracking-wider text-blue-800">
                      {currentQuestion.passageObj?.title || currentQuestion.setObj?.title}
                    </h3>
                    <button
                      type="button"
                      onClick={() => setIsFullscreenPane((v) => !v)}
                      className="text-slate-500 hover:text-slate-800 p-1 rounded"
                      title="Toggle Pane Width"
                    >
                      {isFullscreenPane ? <Minimize2 className="w-4 h-4" /> : <Maximize2 className="w-4 h-4" />}
                    </button>
                  </div>
                  <div className="text-sm text-slate-800 whitespace-pre-line font-serif space-y-3">
                    {currentQuestion.passageObj?.text || currentQuestion.setObj?.context}
                  </div>
                </div>
              )}

              {/* Right Question & Options / TITA Pane */}
              {(!isSplitLayout || !isFullscreenPane) && (
                <div
                  className={`${
                    isSplitLayout ? 'md:w-1/2 h-1/2 md:h-full' : 'w-full h-full'
                  } overflow-y-auto p-5 sm:p-6 bg-white`}
                >
                  <div className="text-sm sm:text-[15px] font-medium text-slate-900 whitespace-pre-line leading-relaxed mb-5">
                    {currentQuestion.question}
                  </div>

                  {currentQuestion.type === 'MCQ' ? (
                    <div className="space-y-2.5 max-w-2xl">
                      {currentQuestion.options.map((opt, oIdx) => {
                        const isSelected = currentDraftAnswer === String(oIdx);
                        return (
                          <label
                            key={oIdx}
                            onClick={() => setCurrentDraftAnswer(String(oIdx))}
                            className={`flex items-start gap-3 p-3.5 rounded-lg border cursor-pointer transition ${
                              isSelected
                                ? 'bg-blue-50 border-blue-600 ring-1 ring-blue-600'
                                : 'bg-white border-slate-300 hover:bg-slate-50'
                            }`}
                          >
                            <input
                              type="radio"
                              name={`q_${currentQuestion.id}`}
                              checked={isSelected}
                              onChange={() => setCurrentDraftAnswer(String(oIdx))}
                              className="mt-1 accent-blue-600 w-4 h-4 shrink-0"
                            />
                            <span className="text-sm text-slate-800 leading-snug">
                              <strong className="mr-1.5 text-slate-600">({String.fromCharCode(65 + oIdx)})</strong>
                              {opt}
                            </span>
                          </label>
                        );
                      })}
                    </div>
                  ) : (
                    <TitaVirtualKeypad value={currentDraftAnswer} onChange={setCurrentDraftAnswer} />
                  )}
                </div>
              )}
            </div>

            {/* Bottom TCS iON Action Bar */}
            <div className="bg-slate-100 border-t border-slate-300 px-4 py-2.5 flex flex-wrap items-center justify-between gap-2 shrink-0">
              <div className="flex flex-wrap items-center gap-2">
                <button
                  type="button"
                  onClick={handleMarkForReviewAndNext}
                  className="px-3.5 py-2 rounded bg-purple-700 hover:bg-purple-800 text-white text-xs font-bold shadow-xs transition"
                >
                  Mark for Review & Next
                </button>
                <button
                  type="button"
                  onClick={handleClearResponse}
                  className="px-3.5 py-2 rounded bg-white hover:bg-slate-200 text-slate-800 border border-slate-300 text-xs font-bold transition"
                >
                  Clear Response
                </button>
              </div>

              <div className="flex items-center gap-2">
                <button
                  type="button"
                  onClick={handleSaveAndNext}
                  className="px-5 py-2 rounded bg-[#2563eb] hover:bg-blue-700 text-white text-xs font-bold shadow-xs transition"
                >
                  Save & Next
                </button>
                <button
                  type="button"
                  onClick={() => setShowSubmitConfirm(true)}
                  className="px-4 py-2 rounded bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-xs transition lg:hidden"
                >
                  {activeSecIdx < examSections.length - 1 ? 'Submit Section' : 'Submit Test'}
                </button>
              </div>
            </div>
          </div>

          {/* Right Sidebar: Candidate Profile + TCS iON Question Palette */}
          <aside className="w-full lg:w-80 bg-[#eef2f6] flex flex-col shrink-0 max-h-60 lg:max-h-none border-t lg:border-t-0 border-slate-300">
            {/* Candidate Profile Strip */}
            <div className="p-3 bg-white border-b border-slate-300 flex items-center gap-3">
              <div className="w-10 h-10 rounded-full bg-blue-900 text-white flex items-center justify-center font-bold text-sm shrink-0">
                <User className="w-5 h-5" />
              </div>
              <div className="min-w-0">
                <div className="text-xs font-extrabold text-slate-900 truncate">{candidateName}</div>
                <div className="text-[11px] text-slate-500">Roll No: CAT{selectedYear}0{selectedSlot}89</div>
              </div>
            </div>

            {/* Status Legend with Live Counts */}
            <div className="p-3 bg-white border-b border-slate-300 grid grid-cols-2 gap-2 text-[11px] font-semibold text-slate-700">
              <div className="flex items-center gap-1.5">
                <span className="w-5 h-5 rounded-t-md rounded-b-xs bg-emerald-600 text-white flex items-center justify-center text-[10px] font-bold shrink-0">
                  {paletteCounts.ANSWERED}
                </span>
                <span>Answered</span>
              </div>
              <div className="flex items-center gap-1.5">
                <span className="w-5 h-5 rounded-t-xs rounded-b-md bg-rose-600 text-white flex items-center justify-center text-[10px] font-bold shrink-0">
                  {paletteCounts.NOT_ANSWERED}
                </span>
                <span>Not Answered</span>
              </div>
              <div className="flex items-center gap-1.5">
                <span className="w-5 h-5 rounded bg-slate-200 border border-slate-300 text-slate-800 flex items-center justify-center text-[10px] font-bold shrink-0">
                  {paletteCounts.NOT_VISITED}
                </span>
                <span>Not Visited</span>
              </div>
              <div className="flex items-center gap-1.5">
                <span className="w-5 h-5 rounded-full bg-purple-600 text-white flex items-center justify-center text-[10px] font-bold shrink-0">
                  {paletteCounts.MARKED}
                </span>
                <span>Marked</span>
              </div>
              <div className="col-span-2 flex items-center gap-1.5">
                <span className="w-5 h-5 rounded-full bg-purple-600 text-white flex items-center justify-center text-[10px] font-bold relative shrink-0">
                  {paletteCounts.ANSWERED_MARKED}
                  <span className="w-2 h-2 bg-emerald-400 rounded-full absolute -bottom-0.5 -right-0.5" />
                </span>
                <span>Answered & Marked for Review</span>
              </div>
            </div>

            {/* Section Header Banner */}
            <div className="bg-[#1e3a8a] text-white px-3 py-1.5 text-xs font-bold">
              {currentSectionObj.section} — Question Palette
            </div>

            {/* Numbered Question Grid */}
            <div className="flex-1 overflow-y-auto p-3">
              <div className="grid grid-cols-5 sm:grid-cols-8 lg:grid-cols-5 gap-2">
                {currentSectionObj.questions.map((q, idx) => (
                  <PaletteBadge
                    key={q.id}
                    number={q.qNumber}
                    status={responses[q.id]?.status || 'NOT_VISITED'}
                    active={idx === activeQIdx}
                    onClick={() => handleJumpToQuestion(idx)}
                  />
                ))}
              </div>
            </div>

            {/* Desktop Submit Section / Exam Button */}
            <div className="p-3 bg-white border-t border-slate-300 hidden lg:block">
              <button
                type="button"
                onClick={() => setShowSubmitConfirm(true)}
                className="w-full py-2.5 rounded bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold uppercase tracking-wider shadow transition"
              >
                {activeSecIdx < examSections.length - 1
                  ? `Submit ${currentSectionObj.section} & Next Section`
                  : 'Submit Exam & View Analysis'}
              </button>
            </div>
          </aside>
        </div>

        {/* Floating Scientific Calculator */}
        {showCalc && <CatScientificCalculator onClose={() => setShowCalc(false)} />}

        {/* Submit Confirmation Summary Modal */}
        {showSubmitConfirm && (
          <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
            <div className="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl border border-slate-300">
              <div className="flex items-center gap-2.5 text-amber-600 mb-2">
                <AlertTriangle className="w-5 h-5" />
                <h3 className="text-base font-extrabold text-slate-900">
                  {activeSecIdx < examSections.length - 1
                    ? `Confirm ${currentSectionObj.section} Section Submission`
                    : 'Confirm Final Exam Submission'}
                </h3>
              </div>
              <p className="text-xs text-slate-600 mb-4">
                {activeSecIdx < examSections.length - 1
                  ? 'Once submitted, you cannot return to this section. The next 40-minute section timer will begin immediately.'
                  : 'Are you sure you want to submit your test and generate your detailed CAT scorecard?'}
              </p>

              <div className="bg-slate-50 border border-slate-200 rounded-lg p-3 mb-5 text-xs space-y-1.5">
                <div className="flex justify-between">
                  <span className="text-slate-600">Total Questions in {currentSectionObj.section}:</span>
                  <span className="font-bold">{currentSectionObj.questions.length}</span>
                </div>
                <div className="flex justify-between text-emerald-700">
                  <span>Answered:</span>
                  <span className="font-bold">{paletteCounts.ANSWERED + paletteCounts.ANSWERED_MARKED}</span>
                </div>
                <div className="flex justify-between text-rose-700">
                  <span>Not Answered:</span>
                  <span className="font-bold">{paletteCounts.NOT_ANSWERED}</span>
                </div>
                <div className="flex justify-between text-purple-700">
                  <span>Marked for Review (Unanswered):</span>
                  <span className="font-bold">{paletteCounts.MARKED}</span>
                </div>
                <div className="flex justify-between text-slate-600">
                  <span>Not Visited:</span>
                  <span className="font-bold">{paletteCounts.NOT_VISITED}</span>
                </div>
              </div>

              <div className="flex justify-end gap-2.5">
                <button
                  type="button"
                  onClick={() => setShowSubmitConfirm(false)}
                  className="px-4 py-2 rounded bg-slate-200 hover:bg-slate-300 text-slate-800 text-xs font-bold"
                >
                  Resume Section
                </button>
                <button
                  type="button"
                  onClick={handleConfirmSectionOrExamSubmit}
                  className="px-4 py-2 rounded bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold"
                >
                  Yes, Proceed
                </button>
              </div>
            </div>
          </div>
        )}

        {/* Question Paper View Modal */}
        {showQuestionPaper && (
          <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
            <div className="bg-white rounded-xl max-w-3xl w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
              <div className="bg-[#1e3a8a] text-white px-5 py-3 flex items-center justify-between">
                <h3 className="text-sm font-bold">
                  Full Question Paper — {currentSectionObj.section} (CAT {selectedYear} Slot {selectedSlot})
                </h3>
                <button onClick={() => setShowQuestionPaper(false)}>
                  <X className="w-5 h-5" />
                </button>
              </div>
              <div className="p-5 overflow-y-auto space-y-5 divide-y divide-slate-200">
                {currentSectionObj.questions.map((q) => (
                  <div key={q.id} className="pt-4 first:pt-0">
                    <div className="text-xs font-bold text-blue-800 mb-1">
                      Q.{q.qNumber} [{q.type}] — {q.topic}
                    </div>
                    <p className="text-sm text-slate-800 whitespace-pre-line">{q.question}</p>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {/* Instructions Modal */}
        {showInstructions && (
          <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
            <div className="bg-white rounded-xl max-w-xl w-full p-6 shadow-2xl">
              <div className="flex items-center justify-between pb-3 border-b border-slate-200">
                <h3 className="text-base font-bold text-slate-900">CAT Exam Instructions</h3>
                <button onClick={() => setShowInstructions(false)}>
                  <X className="w-5 h-5 text-slate-500" />
                </button>
              </div>
              <ul className="mt-4 space-y-2.5 text-xs text-slate-700 leading-relaxed list-disc pl-4">
                <li>Each section is strictly timed at <strong>40 minutes</strong>. The timer counts down and auto-submits when it reaches 00:00.</li>
                <li><strong>Marking Scheme:</strong> +3 marks for every correct answer. -1 mark for every incorrect MCQ answer. <strong>Zero negative marking</strong> for TITA (Type-In-The-Answer) questions.</li>
                <li>Questions marked as <em>"Answered & Marked for Review"</em> will be evaluated for scoring.</li>
                <li>Use the top-right <strong>Calculator</strong> button for the on-screen scientific calculator.</li>
              </ul>
              <div className="mt-5 text-right">
                <button
                  onClick={() => setShowInstructions(false)}
                  className="px-4 py-2 rounded bg-blue-600 text-white text-xs font-bold"
                >
                  Close
                </button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  // ==========================================================================
  // VIEW 3: POST-TEST DETAILED PERFORMANCE ANALYSIS
  // ==========================================================================
  if (screen === 'ANALYSIS' && activeResult) {
    const filteredQuestions = activeResult.detailedQuestions.filter((q) => {
      if (analysisSectionFilter !== 'ALL' && q.section !== analysisSectionFilter) return false;
      if (analysisStatusFilter === 'CORRECT' && !q.isCorrect) return false;
      if (analysisStatusFilter === 'INCORRECT' && (!q.isAttempted || q.isCorrect)) return false;
      if (analysisStatusFilter === 'UNATTEMPTED' && q.isAttempted) return false;
      if (
        analysisStatusFilter === 'REVIEWED' &&
        q.status !== 'MARKED' &&
        q.status !== 'ANSWERED_MARKED'
      )
        return false;
      return true;
    });

    return (
      <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
        {/* Top Analysis Header */}
        <header className="bg-slate-900 border-b border-slate-800 px-4 sm:px-6 py-4 sticky top-0 z-30">
          <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <div>
              <div className="flex items-center gap-2">
                <span className="px-2.5 py-0.5 rounded-md text-xs font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                  PERFORMANCE REPORT
                </span>
                <span className="text-xs text-slate-400">{activeResult.timestamp}</span>
              </div>
              <h1 className="text-lg sm:text-xl font-extrabold text-white mt-1">
                CAT {activeResult.year} (Slot {activeResult.slot}) — {activeResult.sectionLabel}
              </h1>
            </div>

            <div className="flex items-center gap-2.5">
              <button
                type="button"
                onClick={startExam}
                className="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold flex items-center gap-1.5 border border-slate-700"
              >
                <RotateCcw className="w-3.5 h-3.5" />
                <span>Re-Attempt</span>
              </button>
              <button
                type="button"
                onClick={() => setScreen('LOBBY')}
                className="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold flex items-center gap-1.5 shadow"
              >
                <span>Back to Exam Lobby</span>
              </button>
            </div>
          </div>
        </header>

        <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 space-y-6">
          {/* 1. Hero Scorecard Metrics */}
          <section className="grid grid-cols-2 lg:grid-cols-5 gap-4">
            <div className="col-span-2 lg:col-span-1 bg-gradient-to-br from-blue-600 to-indigo-700 rounded-2xl p-5 shadow-xl text-white">
              <div className="text-xs font-semibold uppercase tracking-wider opacity-85 flex items-center gap-1.5">
                <Award className="w-4 h-4" />
                <span>Net CAT Score</span>
              </div>
              <div className="text-3xl sm:text-4xl font-black mt-2">
                {activeResult.totalScore}
                <span className="text-base font-semibold opacity-75"> / {activeResult.maxPossibleMarks}</span>
              </div>
              <div className="text-xs mt-2 opacity-90">
                +{activeResult.totalPositiveMarks} Pos • -{activeResult.totalNegativeMarks} Neg
              </div>
            </div>

            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
              <div className="text-xs font-semibold text-slate-400 uppercase flex items-center gap-1.5">
                <TrendingUp className="w-4 h-4 text-amber-400" />
                <span>Est. CAT Percentile</span>
              </div>
              <div className="text-3xl font-black text-amber-400 mt-2">
                {activeResult.estimatedPercentile}%ile
              </div>
              <div className="text-[11px] text-slate-400 mt-1.5">
                Calibrated to CAT {activeResult.year} curve
              </div>
            </div>

            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
              <div className="text-xs font-semibold text-slate-400 uppercase flex items-center gap-1.5">
                <Target className="w-4 h-4 text-emerald-400" />
                <span>Accuracy Rate</span>
              </div>
              <div className="text-3xl font-black text-emerald-400 mt-2">{activeResult.overallAccuracy}%</div>
              <div className="text-[11px] text-slate-400 mt-1.5">
                {activeResult.totalCorrect} Right • {activeResult.totalIncorrect} Wrong
              </div>
            </div>

            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
              <div className="text-xs font-semibold text-slate-400 uppercase flex items-center gap-1.5">
                <CheckCircle2 className="w-4 h-4 text-blue-400" />
                <span>Attempt Rate</span>
              </div>
              <div className="text-3xl font-black text-white mt-2">{activeResult.attemptRate}%</div>
              <div className="text-[11px] text-slate-400 mt-1.5">
                {activeResult.totalCorrect + activeResult.totalIncorrect} of {activeResult.totalQuestionsCount} Qs
              </div>
            </div>

            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
              <div className="text-xs font-semibold text-slate-400 uppercase flex items-center gap-1.5">
                <Clock className="w-4 h-4 text-purple-400" />
                <span>Total Time Used</span>
              </div>
              <div className="text-3xl font-black text-purple-300 mt-2">
                {Math.floor(activeResult.totalTimeSeconds / 60)}m {activeResult.totalTimeSeconds % 60}s
              </div>
              <div className="text-[11px] text-slate-400 mt-1.5">
                Avg {Math.round(activeResult.totalTimeSeconds / Math.max(1, activeResult.totalQuestionsCount))}s / Q
              </div>
            </div>
          </section>

          {/* 2. Sectional Breakdown Table */}
          <section className="bg-slate-900 border border-slate-800 rounded-2xl p-5 sm:p-6 shadow-xl">
            <h2 className="text-sm font-bold uppercase tracking-wider text-blue-400 mb-4">
              Sectional Scorecard & Cutoff Benchmark
            </h2>
            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse text-xs sm:text-sm">
                <thead>
                  <tr className="border-b border-slate-800 text-slate-400 text-xs uppercase">
                    <th className="py-3 px-3">Section</th>
                    <th className="py-3 px-3">Score</th>
                    <th className="py-3 px-3">Correct / Wrong / Left</th>
                    <th className="py-3 px-3">Accuracy</th>
                    <th className="py-3 px-3">Time Taken</th>
                    <th className="py-3 px-3">Est. Percentile</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800/70">
                  {activeResult.sectionBreakdown.map((sec) => (
                    <tr key={sec.section} className="hover:bg-slate-800/40">
                      <td className="py-3.5 px-3 font-extrabold text-white">{sec.section}</td>
                      <td className="py-3.5 px-3 font-bold text-blue-400">
                        {sec.score} <span className="text-slate-500 font-normal">/ {sec.maxMarks}</span>
                      </td>
                      <td className="py-3.5 px-3">
                        <span className="text-emerald-400 font-semibold">{sec.correct}C</span> •{' '}
                        <span className="text-rose-400 font-semibold">{sec.incorrect}W</span> •{' '}
                        <span className="text-slate-400">{sec.unattempted}U</span>
                      </td>
                      <td className="py-3.5 px-3 font-semibold text-white">{sec.accuracy}%</td>
                      <td className="py-3.5 px-3 text-slate-300">{formatClock(sec.timeSpent)}</td>
                      <td className="py-3.5 px-3">
                        <span className="px-2.5 py-0.5 rounded-full bg-amber-500/15 text-amber-300 font-bold text-xs">
                          {sec.estimatedPercentile}%ile
                        </span>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </section>

          {/* 3. Topic-Wise Strength & Weakness Diagnostic */}
          <section className="bg-slate-900 border border-slate-800 rounded-2xl p-5 sm:p-6 shadow-xl">
            <h2 className="text-sm font-bold uppercase tracking-wider text-blue-400 mb-4">
              Topic-Wise Accuracy & Time Allocation
            </h2>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {activeResult.topicBreakdown.map((t) => {
                const attempted = t.correct + t.incorrect;
                const acc = attempted > 0 ? Math.round((t.correct / attempted) * 100) : 0;
                return (
                  <div key={`${t.section}_${t.topic}`} className="bg-slate-950 border border-slate-800 rounded-xl p-4">
                    <div className="flex items-center justify-between gap-2 mb-2">
                      <div>
                        <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-800 text-blue-300 mr-2">
                          {t.section}
                        </span>
                        <span className="text-xs font-bold text-white">{t.topic}</span>
                      </div>
                      <span className="text-xs font-extrabold text-slate-300">
                        {t.score >= 0 ? `+${t.score}` : t.score} pts
                      </span>
                    </div>

                    {/* Visual Accuracy Bar */}
                    <div className="w-full h-2 bg-slate-800 rounded-full overflow-hidden mb-2">
                      <div
                        className={`h-full rounded-full ${
                          acc >= 75 ? 'bg-emerald-500' : acc >= 45 ? 'bg-amber-500' : 'bg-rose-500'
                        }`}
                        style={{ width: `${attempted > 0 ? acc : 0}%` }}
                      />
                    </div>

                    <div className="flex items-center justify-between text-[11px] text-slate-400">
                      <span>
                        {t.correct}/{t.total} Correct ({attempted > 0 ? `${acc}% Acc` : 'Unattempted'})
                      </span>
                      <span>Time: {formatClock(t.timeSpent)}</span>
                    </div>
                  </div>
                );
              })}
            </div>
          </section>

          {/* 4. Question-by-Question Review & Worked Solutions */}
          <section className="bg-slate-900 border border-slate-800 rounded-2xl p-5 sm:p-6 shadow-xl">
            <div className="flex flex-wrap items-center justify-between gap-3 mb-5">
              <h2 className="text-sm font-bold uppercase tracking-wider text-blue-400">
                Question-by-Question Review & Worked Solutions ({filteredQuestions.length})
              </h2>

              <div className="flex flex-wrap items-center gap-2">
                {activeResult.sectionBreakdown.length > 1 && (
                  <select
                    value={analysisSectionFilter}
                    onChange={(e) => setAnalysisSectionFilter(e.target.value)}
                    className="bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white"
                  >
                    <option value="ALL">All Sections</option>
                    {activeResult.sectionBreakdown.map((s) => (
                      <option key={s.section} value={s.section}>
                        {s.section}
                      </option>
                    ))}
                  </select>
                )}

                {[
                  { id: 'ALL', label: 'All' },
                  { id: 'CORRECT', label: 'Correct' },
                  { id: 'INCORRECT', label: 'Incorrect' },
                  { id: 'UNATTEMPTED', label: 'Unattempted' },
                  { id: 'REVIEWED', label: 'Marked' }
                ].map((f) => (
                  <button
                    key={f.id}
                    type="button"
                    onClick={() => setAnalysisStatusFilter(f.id)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                      analysisStatusFilter === f.id
                        ? 'bg-blue-600 text-white'
                        : 'bg-slate-950 text-slate-400 border border-slate-800 hover:text-white'
                    }`}
                  >
                    {f.label}
                  </button>
                ))}
              </div>
            </div>

            <div className="space-y-4">
              {filteredQuestions.map((q) => (
                <div
                  key={q.id}
                  className={`rounded-xl border p-5 bg-slate-950 ${
                    !q.isAttempted
                      ? 'border-slate-800'
                      : q.isCorrect
                      ? 'border-emerald-700/60'
                      : 'border-rose-700/60'
                  }`}
                >
                  <div className="flex flex-wrap items-center justify-between gap-2 pb-3 mb-3 border-b border-slate-800">
                    <div className="flex items-center gap-2">
                      <span className="px-2.5 py-0.5 rounded bg-slate-800 text-white font-bold text-xs">
                        {q.section} Q.{q.qNumber}
                      </span>
                      <span className="text-xs text-slate-400">{q.topic}</span>
                      <span className="text-[11px] px-2 py-0.5 rounded bg-slate-900 border border-slate-700 text-slate-300">
                        {q.type}
                      </span>
                    </div>

                    <div className="flex items-center gap-3 text-xs font-bold">
                      <span className="text-slate-400 font-normal">Time: {q.timeSpent}s</span>
                      {!q.isAttempted ? (
                        <span className="text-slate-400">Unattempted (0)</span>
                      ) : q.isCorrect ? (
                        <span className="text-emerald-400 flex items-center gap-1">
                          <CheckCircle2 className="w-4 h-4" /> Correct (+3)
                        </span>
                      ) : (
                        <span className="text-rose-400 flex items-center gap-1">
                          <XCircle className="w-4 h-4" /> Incorrect ({q.marksAwarded})
                        </span>
                      )}
                    </div>
                  </div>

                  {/* Collapsible Passage / Caselet if present */}
                  {(q.passageObj || q.setObj) && (
                    <details className="mb-3 bg-slate-900/80 border border-slate-800 rounded-lg p-3">
                      <summary className="text-xs font-semibold text-blue-400 cursor-pointer">
                        View Associated Passage / DILR Caselet ({q.passageObj?.title || q.setObj?.title})
                      </summary>
                      <p className="mt-2 text-xs text-slate-300 whitespace-pre-line leading-relaxed">
                        {q.passageObj?.text || q.setObj?.context}
                      </p>
                    </details>
                  )}

                  <p className="text-sm text-slate-200 whitespace-pre-line mb-4">{q.question}</p>

                  {/* Options or TITA comparison */}
                  {q.type === 'MCQ' ? (
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-4">
                      {q.options.map((opt, idx) => {
                        const isCorr = String(idx) === String(q.correctAnswer);
                        const isUser = q.isAttempted && String(idx) === String(q.userAnswer);
                        let cls = 'border-slate-800 bg-slate-900/50 text-slate-300';
                        if (isCorr) cls = 'border-emerald-500 bg-emerald-950/40 text-emerald-200 font-semibold';
                        else if (isUser && !isCorr) cls = 'border-rose-500 bg-rose-950/40 text-rose-200';

                        return (
                          <div key={idx} className={`p-2.5 rounded-lg border text-xs flex items-start gap-2 ${cls}`}>
                            <span className="font-bold">({String.fromCharCode(65 + idx)})</span>
                            <span className="flex-1">{opt}</span>
                            {isCorr && <span className="text-[10px] uppercase font-bold text-emerald-400">Correct</span>}
                            {isUser && !isCorr && <span className="text-[10px] uppercase font-bold text-rose-400">Your Pick</span>}
                          </div>
                        );
                      })}
                    </div>
                  ) : (
                    <div className="flex flex-wrap gap-4 mb-4 text-xs">
                      <div className="px-3 py-2 rounded-lg bg-slate-900 border border-slate-800">
                        <span className="text-slate-400 mr-2">Your Answer:</span>
                        <span className={`font-mono font-bold ${q.isCorrect ? 'text-emerald-400' : 'text-rose-400'}`}>
                          {q.isAttempted ? q.userAnswer : 'Not Attempted'}
                        </span>
                      </div>
                      <div className="px-3 py-2 rounded-lg bg-emerald-950/30 border border-emerald-700/50">
                        <span className="text-emerald-300 mr-2">Official Answer:</span>
                        <span className="font-mono font-bold text-emerald-400">{q.correctAnswer}</span>
                      </div>
                    </div>
                  )}

                  {/* Worked Solution Box */}
                  <div className="bg-blue-950/20 border border-blue-900/50 rounded-lg p-3.5">
                    <div className="text-[11px] font-bold uppercase tracking-wider text-blue-400 mb-1">
                      Step-by-Step Solution
                    </div>
                    <p className="text-xs text-slate-300 whitespace-pre-line leading-relaxed">{q.solution}</p>
                  </div>
                </div>
              ))}
            </div>
          </section>
        </main>
      </div>
    );
  }

  return null;
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
